name: Weekly regional source collection
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04  # Playwright from region-intel cannot install on Ubuntu 26.04; unpin after docxology/region-intel#3
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run validate
      - run: bun run weekly-check
        env:
          HEADLESS_BROWSER: '1'
      - run: bun run pages:export
      - run: bun run pages:validate -- .pages
